<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Bersama</title>
    <link rel="stylesheet" href="note.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="workspace">
        <div class="col-note">
            <h2>Catatan Ummi</h2>
            <textarea id="note-ummi" placeholder="Tulis catatanmu di sini, Ummi..."></textarea>
            <button id="btn-ummi">Simpan</button>
        </div>

        <div class="col-note">
            <h2>Catatan Rohmad</h2>
            <textarea id="note-rohmad" placeholder="Tulis catatanmu di sini, Rohmad..."></textarea>
            <button id="btn-rohmad">Simpan</button>
        </div>
    </div>
    <script src="note.js"></script>
</body>
</html>
